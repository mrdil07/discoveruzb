# DiscoverUzb — lokal development uchun docker-compose
#
# Foydalanish:
#   cp ../backend/.env.example ../backend/.env  # va to'ldiring
#   docker compose up -d
#   docker compose exec backend alembic upgrade head
#
# Servislar:
#   - postgres :5432
#   - redis    :6379
#   - minio    :9000 (API), :9001 (web console — admin/admin)
#   - backend  :8000 (FastAPI, hot-reload)
#
# Admin panel va mobile lokal'da o'z dev server'lari bilan ishlaydi.

name: discoveruzb

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: discoveruzb
      POSTGRES_USER: discoveruzb
      POSTGRES_PASSWORD: discoveruzb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discoveruzb -d discoveruzb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/media-public local/media-private &&
      mc anonymous set download local/media-public &&
      echo '✓ Bucket tuzilgan';
      "

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      # Compose ichida service nomi bilan ishlatiladi
      DATABASE_URL: postgresql+asyncpg://discoveruzb:discoveruzb@postgres:5432/discoveruzb
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  redis_data:
  minio_data:
