[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "discoveruzb-backend"
version = "0.1.0"
description = "DiscoverUzb backend API — FastAPI + PostgreSQL + Redis + MinIO"
authors = [{ name = "MrDil", email = "uicodooteam@gmail.com" }]
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",

    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "google-auth>=2.36.0",
    "requests>=2.32.0",          # google-auth transport

    # HTTP
    "httpx>=0.28.0",

    # Storage
    "minio>=7.2.0",

    # Cache & rate limit
    "redis>=5.2.0",

    # Image processing
    "pillow>=11.0.0",

    # Utils
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
    "python-slugify>=8.0.0",
    "phonenumbers>=8.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "B",          # flake8-bugbear
    "UP",         # pyupgrade
    "SIM",        # flake8-simplify
    "RUF",        # ruff-specific
    "ASYNC",      # flake8-async
    "S",          # bandit (security)
]
ignore = [
    "S101",       # assert ishlatish (testlarda OK)
    "B008",       # FastAPI Depends(...)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
"alembic/env.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
# pytest-asyncio 0.23: event_loop fixture session-scope (conftest.py'da)

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]
