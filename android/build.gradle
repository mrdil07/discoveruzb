// Yangi Flutter Android format'da `buildscript` va `plugins` blokini
// `settings.gradle`'ga ko'chirildi (Gradle 8+).
//
// Bu fayl faqat repositories va clean task uchun.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
